# This sets the schema for Liquibase's own tracking tables.
# The error log showed it was trying to create "ecommerce_yt.databasechangelog",
# which is fixed by setting the `liquibase-schema`.
spring.liquibase.liquibase-schema=spicelot

# This sets the default schema for your application's tables (e.g., users, products).
# Use `public` for local development so the schema exists in the containerized Postgres.
spring.liquibase.default-schema=spicelot